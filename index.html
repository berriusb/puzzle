<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사락 문학 십자말풀이 (중복 제거)</title>
    
    <style>
        /* --- 색상 변수 정의 (메인 컬러 반영) --- */
        :root {
            --main-color: #0080FF; /* 요청하신 메인 파란색 */
            --main-color-hover: #3399FF; /* 호버 시 약간 밝게 */
            --main-color-active: #0066CC; /* 클릭 시 약간 어둡게 */
            --main-color-light: #E6F2FF; /* 선택된 카드 배경용 아주 연한 파랑 */
            
            --bg-color: #f0f2f5;
            --text-color-primary: #333;
            --text-color-secondary: #666;
            --card-bg: white;
            --card-border: #ddd;
            --incorrect-color: #ea2b2b; /* 틀렸을 때 빨간색 (유지) */
            --incorrect-bg: #ffefef;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-color-primary);
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5em; /* 타이틀 크기 키움 */
        }

        .description {
            color: var(--text-color-secondary);
            margin-bottom: 40px; /* 여백 늘림 */
            text-align: center;
            max-width: 500px; /* 너비 늘림 */
            font-size: 1.1em; /* 폰트 크기 키움 */
            line-height: 1.6; /* 줄 간격 조절 */
        }

        /* 공통 버튼 스타일 (메인 컬러 반영 및 3D 효과) */
        .btn-primary {
            background-color: var(--main-color);
            color: white;
            border: none;
            border-bottom: 5px solid var(--main-color-active); /* 3D 효과 피벗 */
            border-radius: 14px; /* 테두리 둥글게 */
            padding: 16px 32px; /* 패딩 늘림 */
            font-size: 1.2em; /* 폰트 크기 키움 */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: var(--main-color-hover);
        }

        .btn-primary:active {
            border-bottom-width: 0;
            transform: translateY(5px); /* 클릭 시 들어가는 효과 피벗 */
        }

        /* --- 화면 섹션 스타일 --- */
        .screen {
            display: none; /* 기본적으로 숨김 */
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px; /* 최대 너비 늘림 */
        }

        /* 시작 화면 */
        #start-screen {
            display: flex; /* 처음에만 보이도록 설정 */
        }

        /* 게임 화면 (게임 보드) */
        #game-screen {
            /* display: flex; (JS에서 제어) */
        }

        /* 결과 화면 */
        #result-screen {
            /* display: flex; (JS에서 제어) */
            text-align: center;
        }

        /* --- 게임 보드 및 카드 스타일 (메인 컬러 반영 및 모바일 우선 배치) --- */
        #game-board {
            display: grid;
            /* 모바일 환경에서는 2열 배치를 기본으로 설정하여 카드가 너무 작아지지 않도록 함 */
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; /* 간격 넓힘 */
            width: 100%; /* 너비 꽉 차게 */
            margin-top: 30px; /* 여백 늘림 */
            padding: 0 10px; /* 측면 패딩 추가 */
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--card-border); /* 테두리 굵게 */
            border-bottom-width: 6px; /* 약간의 3D 효과 피벗 */
            border-radius: 18px; /* 테두리 둥글게 */
            padding: 18px; /* 패딩 늘림 */
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 3px 7px rgba(0,0,0,0.07); /* 그림자 진하게 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px; /* 최소 높이 늘림 */
            user-select: none;
            font-weight: bold; /* 폰트 굵게 */
            font-size: 1.1em; /* 폰트 크기 키움 */
            word-break: keep-all; /* 단어 단위 줄바꿈 */
            line-height: 1.4; /* 줄 간격 조절 */
        }

        .card:hover:not(.matched):not(.selected) {
            border-color: #b0b0b0; /* 호버 시 테두리 색상 진하게 */
            background-color: #f9f9f9; /* 호버 시 배경색 약간 변경 */
        }

        /* 선택된 카드 스타일 (메인 컬러 반영) */
        .card.selected {
            background-color: var(--main-color-light);
            border-color: var(--main-color);
            color: var(--main-color-active);
            box-shadow: 0 5px 12px rgba(0, 128, 255, 0.2); /* 푸른색 그림자 진하게 */
        }

        /* 매칭된 카드 스타일 (투명해지며 클릭 불가) */
        .card.matched {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* 틀렸을 때 흔들리는 애니메이션 (유지) */
        .card.incorrect {
            animation: shake 0.4s ease-in-out;
            border-color: #ffb0b0; /* 테두리 색상 조정 */
            background-color: var(--incorrect-bg);
            color: var(--incorrect-color);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-7px); } /* 흔들림 강도 피벗 */
            40%, 80% { transform: translateX(7px); } /* 흔들림 강도 피벗 */
        }

        /* 제목 카드와 작가 카드를 시각적으로 약간 다르게 구분 (유지) */
        .card[data-type="title"] {
            color: #1a1a1a; /* 색상 진하게 */
        }
        .card[data-type="author"] {
            color: #4d4d4d; /* 색상 연하게 */
            font-style: italic;
        }

        /* 결과 메시지 스타일 (메인 컬러 반영) */
        #result-screen h2 {
            color: var(--main-color);
            margin-bottom: 15px; /* 여백 늘림 */
            font-size: 2.5em; /* 폰트 크기 키움 */
        }
        #result-screen p {
            color: var(--text-color-secondary);
            margin-bottom: 40px; /* 여백 늘림 */
            font-size: 1.3em; /* 폰트 크기 키움 */
        }

        /* --- 반응형 레이아웃: PC와 같은 넓은 화면에서는 4열 배치로 변경 --- */
        @media (min-width: 650px) {
            #game-board {
                grid-template-columns: repeat(4, 1fr);
            }
            .card {
                padding: 22px;
                min-height: 100px;
                font-size: 1.15em;
                border-radius: 20px;
            }
        }

        /* 화면이 아주 작을 때 타이틀 크기 조절 */
        @media (max-width: 450px) {
            h1 {
                font-size: 2em;
            }
            .description {
                font-size: 1em;
            }
            .card {
                padding: 15px;
                min-height: 80px;
                font-size: 1em;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1>책 & 작가 맞추기</h1>
        <p class="description"><strong>사락 문학 퀴즈</strong><br>베스트셀러 책 제목과 작가를 매칭해 보세요.<br>중복 없이 고유한 항목들을 십자말풀이 스타일로 풀어보세요.</p>
        <button id="start-btn" class="btn-primary">게임 시작</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-board"></div>
    </div>

    <div id="result-screen" class="screen">
        <h2>대단해요! 🎉</h2>
        <p>모든 문학 짝꿍을 찾았습니다.</p>
        <button id="restart-btn" class="btn-primary">다시 하기</button>
    </div>

    <script>
        // --- 1. 고유한 게임 데이터 정의 (십자말풀이/중복 제거 핵심) ---
        
        // 고유한 책 제목 배열
        const bookTitles = [
            "달려라, 아비",
            "두근두근 내 인생",
            "채식주의자",
            "소년이 온다",
            "파친코",
            "저주토끼"
        ];

        // 고유한 작가 배열 (중복 없음)
        const authors = [
            "김애란",
            "한강",
            "이민진", 
            "정보라"
        ];

        // 책 제목 -> 정답 작가 매핑 데이터 (매칭 확인용)
        const bookToAuthorMap = {
            "달려라, 아비": "김애란",
            "두근두근 내 인생": "김애란",
